<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR Boutique | Premium Giyim Demo</title><style>:root{--black:#101010;--pink:#c96e85;--bg:#f8f6f5}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#171717}.demo{text-align:center;background:#111;color:#fff;padding:9px;font-size:12px}header{display:flex;justify-content:space-between;padding:17px 5%;background:#fff;align-items:center;position:sticky;top:0;z-index:5}.brand{font:25px Georgia,serif;letter-spacing:4px}header a{text-decoration:none;color:inherit}.hero{min-height:67vh;display:flex;align-items:center;padding:7%;background:linear-gradient(90deg,#0009,#0001),url('https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1600&q=85') center/cover;color:#fff}.hero h1{font:clamp(48px,8vw,90px) Georgia,serif;margin:10px 0}.wrap{max-width:1140px;margin:auto;padding:60px 16px}.heading{text-align:center}.heading h2{font:38px Georgia,serif}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:25px}.filter{border:1px solid #ccc;background:#fff;padding:9px 13px}.filter.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff}.pic{height:310px;background:center/cover;position:relative}.heart{position:absolute;right:10px;top:10px;border:0;background:#fff;border-radius:50%;width:38px;height:38px}.body{padding:14px}.body p{color:#777}.price{font-weight:800}.opts{display:flex;gap:6px;margin:10px 0}.opts span{border:1px solid #ddd;padding:5px 7px;font-size:12px}.btn{border:0;background:#111;color:#fff;padding:10px 12px;font-weight:bold}.wa{display:block;text-align:center;margin:45px auto 0;max-width:360px;background:#22c55e;color:#07130b;padding:14px;text-decoration:none;font-weight:bold}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);opacity:0;background:#111;color:#fff;padding:13px 18px;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.pic{height:430px}}</style></head><body><div class="demo">👗 YUSUF DİJİTAL • PREMIUM BUTİK & GİYİM DEMOSU — Gerçek satış yapılmaz.</div><header><b class="brand">NOIR</b><a href="../../">← Demo Merkezi</a></header><section class="hero"><div><small>NEW SEASON • GAZİANTEP</small><h1>Yeni Sezon.<br>Yeni Sen.</h1><p>Günlük şıklıktan özel davetlere seçilmiş koleksiyon.</p></div></section><main class="wrap"><div class="heading"><h2>Yeni Gelenler</h2><p>Sezonun öne çıkan parçaları</p></div><div id="toolbar" class="toolbar"></div><div id="grid" class="grid"></div><a class="wa" href="https://wa.me/905309112770?text=Butik%20demosunu%20inceledim" target="_blank">WhatsApp'tan Sipariş Bilgisi Al</a></main><div id="toast" class="toast"></div><script>const p=[['Saten Midi Elbise','Elbise','2.490 ₺','https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=700&q=80'],['Oversize Blazer','Ceket','2.850 ₺','https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=700&q=80'],['Premium Triko','Üst Giyim','1.390 ₺','https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=700&q=80'],['Palazzo Pantolon','Alt Giyim','1.650 ₺','https://images.unsplash.com/photo-1506629082955-511b1aa562c8?auto=format&fit=crop&w=700&q=80'],['Davet Elbisesi','Elbise','3.750 ₺','https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=700&q=80'],['Keten Takım','Takım','3.290 ₺','https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=80'],['Crop Ceket','Ceket','1.990 ₺','https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=700&q=80'],['Basic Gömlek','Üst Giyim','1.190 ₺','https://images.unsplash.com/photo-1605763240000-7e93b172d754?auto=format&fit=crop&w=700&q=80']];let a='Tümü';function render(){let c=['Tümü',...new Set(p.map(x=>x[1]))];toolbar.innerHTML=c.map(x=>`<button class="filter ${a===x?'active':''}" onclick="a='${x}';render()">${x}</button>`).join('');grid.innerHTML=p.filter(x=>a==='Tümü'||x[1]===a).map(x=>`<article class="card"><div class="pic" style="background-image:url('${x[3]}')"><button class="heart" onclick="msg('Favorilere eklendi')">♡</button></div><div class="body"><small>${x[1]}</small><h3>${x[0]}</h3><span class="price">${x[2]}</span><div class="opts"><span>S</span><span>M</span><span>L</span><span>XL</span></div><button class="btn" onclick="msg('${x[0]} için demo sipariş talebi hazırlandı')">WhatsApp Sipariş</button></div></article>`).join('')}function msg(m){toast.textContent='✓ '+m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}render()</script></body></html>
